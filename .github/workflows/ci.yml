name: offline-evaluation

on:
  push:
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run offline evaluation smoke test
        run: python evaluate.py --offline --scale tiny --out results_ci_offline.json
      - name: Regenerate deterministic figures
        run: python make_figures.py --growth-out results_ci_growth.json